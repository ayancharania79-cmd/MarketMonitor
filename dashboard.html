<style>
  :root{
    color-scheme: light;
    --bg: #f6f5f0;
    --page-edge: #efeee7;
    --surface: #ffffff;
    --surface-2: #f0efe8;
    --surface-3: #e9e7dd;
    --border: rgba(20,20,15,0.10);
    --border-strong: rgba(20,20,15,0.16);
    --text-primary: #15171a;
    --text-secondary: #55564e;
    --text-muted: #8b897f;
    --accent: #2159a8;
    --accent-soft: rgba(33,89,168,0.10);
    --accent-ink: #ffffff;
    --pos: #0a7d33;
    --pos-soft: rgba(10,125,51,0.11);
    --neg: #b3261e;
    --neg-soft: rgba(179,38,30,0.10);
    --fund-us: #2a78d6;
    --fund-ca: #c0551e;
    --fund-intl: #158f68;
    --fund-sc: #6249b0;
    --shadow: 0 1px 2px rgba(20,20,15,0.04), 0 8px 24px -12px rgba(20,20,15,0.18);
    --radius: 14px;
    --font-ui: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg: #0c0e0f;
      --page-edge: #08090a;
      --surface: #15181b;
      --surface-2: #1b1f22;
      --surface-3: #23282c;
      --border: rgba(255,255,255,0.09);
      --border-strong: rgba(255,255,255,0.16);
      --text-primary: #f2f2ef;
      --text-secondary: #b8b8b0;
      --text-muted: #83837a;
      --accent: #6ea8f2;
      --accent-soft: rgba(110,168,242,0.14);
      --accent-ink: #08111c;
      --pos: #3ecf72;
      --pos-soft: rgba(62,207,114,0.14);
      --neg: #ff7a70;
      --neg-soft: rgba(255,122,112,0.14);
      --fund-us: #6ea8f2;
      --fund-ca: #ef8a52;
      --fund-intl: #3fcf9e;
      --fund-sc: #ab9af0;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px -16px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg: #0c0e0f;
    --page-edge: #08090a;
    --surface: #15181b;
    --surface-2: #1b1f22;
    --surface-3: #23282c;
    --border: rgba(255,255,255,0.09);
    --border-strong: rgba(255,255,255,0.16);
    --text-primary: #f2f2ef;
    --text-secondary: #b8b8b0;
    --text-muted: #83837a;
    --accent: #6ea8f2;
    --accent-soft: rgba(110,168,242,0.14);
    --accent-ink: #08111c;
    --pos: #3ecf72;
    --pos-soft: rgba(62,207,114,0.14);
    --neg: #ff7a70;
    --neg-soft: rgba(255,122,112,0.14);
    --fund-us: #6ea8f2;
    --fund-ca: #ef8a52;
    --fund-intl: #3fcf9e;
    --fund-sc: #ab9af0;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px -16px rgba(0,0,0,0.6);
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--page-edge);
    color: var(--text-primary);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }
  .num{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  a{ color: var(--accent); }

  .shell{
    max-width: 1180px;
    margin: 0 auto;
    background: var(--bg);
    min-height: 100vh;
    padding: 0 20px 64px;
  }

  /* ---------- header ---------- */
  header.top{
    position: sticky; top:0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 16px 0 14px;
    display:flex; align-items:flex-end; justify-content:space-between; gap: 16px;
    flex-wrap: wrap;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(155deg, var(--accent), var(--fund-intl));
    position: relative; flex: none;
  }
  .brand .mark::before, .brand .mark::after{
    content:""; position:absolute; left: 7px; right: 7px; height: 2px;
    background: color-mix(in srgb, var(--accent-ink) 92%, transparent);
    border-radius: 2px;
  }
  .brand .mark::before{ top: 11px; transform: rotate(-18deg); }
  .brand .mark::after{ top: 17px; width: 60%; transform: rotate(10deg); }
  .brand h1{
    font-size: 19px; margin:0; font-weight: 800; letter-spacing: -0.01em;
  }
  .brand .sub{ font-size: 12.5px; color: var(--text-muted); margin-top:1px; }

  .status{ display:flex; align-items:center; gap: 14px; font-size: 12.5px; color: var(--text-muted); }
  .status .dot{
    width:7px; height:7px; border-radius:50%; background: var(--pos); display:inline-block; margin-right:6px;
    box-shadow: 0 0 0 3px var(--pos-soft);
  }
  .status strong{ color: var(--text-secondary); font-weight: 600; }

  /* ---------- KPI strip ---------- */
  .kpis{
    display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    margin: 20px 0 22px;
  }
  .kpi{
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; cursor:pointer; text-align:left;
    display:flex; flex-direction:column; gap:8px;
    transition: border-color .12s ease, transform .12s ease;
    font: inherit; color: inherit;
  }
  .kpi:hover{ border-color: var(--border-strong); transform: translateY(-1px); }
  .kpi.active{ border-color: var(--fund-c, var(--accent)); box-shadow: 0 0 0 1px var(--fund-c, var(--accent)) inset; }
  .kpi .tag{
    display:inline-flex; align-items:center; gap:6px; font-size: 11.5px; font-weight:700;
    text-transform: uppercase; letter-spacing: .04em; color: var(--fund-c, var(--accent));
  }
  .kpi .tag::before{ content:""; width:7px; height:7px; border-radius:50%; background: var(--fund-c, var(--accent)); }
  .kpi .count{ font-size: 12px; color: var(--text-muted); }
  .kpi .chg{ font-family: var(--font-mono); font-size: 20px; font-weight:600; }
  .kpi .chg.pos{ color: var(--pos); }
  .kpi .chg.neg{ color: var(--neg); }
  .kpi .chg .arrow{ font-size:14px; }
  .kpi .meta{ font-size: 11.5px; color: var(--text-muted); }

  @media (max-width: 860px){ .kpis{ grid-template-columns: repeat(2,1fr); } }

  /* ---------- section headers ---------- */
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    margin: 30px 0 12px; flex-wrap:wrap;
  }
  .section-head h2{ font-size: 15px; margin:0; font-weight: 800; letter-spacing:-.005em; }
  .section-head .hint{ font-size:12px; color:var(--text-muted); }

  /* ---------- movers ---------- */
  .movers{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 700px){ .movers{ grid-template-columns: 1fr; } }
  .movers-col{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
  .movers-col .cap{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); padding: 10px 14px 8px; }
  .mover-row{ display:flex; align-items:center; justify-content:space-between; padding:7px 14px; gap: 10px; }
  .mover-row + .mover-row{ border-top: 1px solid var(--border); }
  .mover-row .who{ display:flex; flex-direction:column; min-width:0; }
  .mover-row .who .n{ font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width: 230px; }
  .mover-row .who .t{ font-size:11px; color:var(--text-muted); font-family: var(--font-mono); }
  .mover-row .chg{ font-family:var(--font-mono); font-size:13px; font-weight:600; white-space:nowrap; }
  .mover-row .chg.pos{ color:var(--pos); } .mover-row .chg.neg{ color:var(--neg); }

  /* ---------- tabs ---------- */
  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); }
  .tab{
    font: inherit; background:none; border:none; cursor:pointer; color: var(--text-secondary);
    padding: 9px 14px; font-size: 13px; font-weight:600; border-radius: 8px 8px 0 0; position:relative; top:1px;
  }
  .tab .n{ color: var(--text-muted); font-weight:500; margin-left:4px; }
  .tab.active{ color: var(--text-primary); border-bottom: 2px solid var(--fund-c, var(--accent)); }
  .tab:hover:not(.active){ color: var(--text-primary); }

  /* ---------- table ---------- */
  .table-wrap{ overflow-x:auto; border:1px solid var(--border); border-top:none; border-radius: 0 0 var(--radius) var(--radius); background:var(--surface); }
  table.holdings{ width:100%; border-collapse:collapse; font-size: 13px; min-width: 640px; }
  table.holdings thead th{
    text-align:left; font-size: 11px; text-transform:uppercase; letter-spacing:.05em; font-weight:700;
    color: var(--text-muted); padding: 10px 14px; border-bottom:1px solid var(--border); white-space:nowrap;
    position: sticky; top: 0; background: var(--surface);
  }
  table.holdings th.num, table.holdings td.num{ text-align:right; }
  table.holdings tbody td{ padding: 9px 14px; border-bottom:1px solid var(--border); vertical-align:middle; }
  table.holdings tbody tr:last-child td{ border-bottom:none; }
  table.holdings tbody tr:hover{ background: var(--surface-2); }
  .name-cell{ display:flex; flex-direction:column; gap:1px; max-width: 320px; }
  .name-cell .n{ font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .name-cell .t{ font-size:11px; color:var(--text-muted); font-family:var(--font-mono); }
  .weight-cell{ display:flex; align-items:center; gap:8px; justify-content:flex-end; }
  .weight-bar{ width:56px; height:5px; border-radius:3px; background:var(--surface-3); overflow:hidden; flex:none; }
  .weight-bar > i{ display:block; height:100%; background: var(--fund-c, var(--accent)); border-radius:3px; }
  .price-cell{ font-family:var(--font-mono); }
  .price-cell .dash{ color: var(--text-muted); font-family: var(--font-ui); }
  .chg-pill{ display:inline-flex; align-items:center; gap:3px; font-family:var(--font-mono); font-weight:600; font-size:12.5px;
    padding: 2px 7px; border-radius: 999px; white-space:nowrap; }
  .chg-pill.pos{ color:var(--pos); background:var(--pos-soft); }
  .chg-pill.neg{ color:var(--neg); background:var(--neg-soft); }
  .chg-pill.flat{ color:var(--text-muted); background:var(--surface-3); }
  .fx-note{ padding: 9px 14px; font-size:12px; color:var(--text-muted); border-top:1px dashed var(--border); }

  /* ---------- news ---------- */
  .news-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 760px){ .news-grid{ grid-template-columns: 1fr; } }
  .news-card{ background:var(--surface); border:1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display:flex; flex-direction:column; gap:8px; }
  .news-card .top{ display:flex; align-items:center; justify-content:space-between; gap: 8px; }
  .news-card .ticker-tag{ font-family: var(--font-mono); font-size:11px; font-weight:700; color: var(--accent); background: var(--accent-soft); padding:2px 7px; border-radius:5px; }
  .news-card .date{ font-size:11px; color:var(--text-muted); }
  .news-card h3{ margin:0; font-size:14px; line-height:1.35; font-weight:700; letter-spacing:-.005em; }
  .news-card p{ margin:0; font-size:12.5px; line-height:1.55; color:var(--text-secondary); }
  .news-card .src{ font-size:11.5px; margin-top:2px; }

  footer{ margin-top: 44px; padding-top:16px; border-top:1px solid var(--border); font-size:11.5px; color:var(--text-muted); line-height:1.6; }
  footer b{ color: var(--text-secondary); }

  ::selection{ background: var(--accent-soft); }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
</style>

<script>
(function(){
  const DATA = JSON.parse(document.getElementById('__data').textContent);
  const FUND_COLOR = { us: 'var(--fund-us)', canadian: 'var(--fund-ca)', intl: 'var(--fund-intl)', smallcap: 'var(--fund-sc)' };
  const FUND_SHORT = { us: 'US', canadian: 'Canadian', intl: 'International', smallcap: 'Small Cap' };
  let activeFund = (DATA.funds[0] || {}).key;

  function fmtPct(x, withSign){
    if (x === null || x === undefined || isNaN(x)) return null;
    const s = (x >= 0 && withSign ? '+' : '') + x.toFixed(2) + '%';
    return s;
  }
  function fmtMoney(x, ccy){
    if (x === null || x === undefined) return null;
    try{
      return new Intl.NumberFormat('en-US', { style:'currency', currency: ccy || 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(x);
    }catch(e){ return x.toFixed(2); }
  }
  function fmtDate(iso){
    if(!iso) return '';
    const d = new Date(iso + 'T00:00:00Z');
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('en-US', { month:'short', day:'numeric', timeZone:'UTC' });
  }
  function fmtUpdated(iso){
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }) + ' UTC';
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function weightedChange(fund){
    let wsum = 0, csum = 0;
    for(const h of fund.holdings){
      if (h.changePercent === null || h.changePercent === undefined) continue;
      wsum += h.weight; csum += h.weight * h.changePercent;
    }
    return wsum > 0 ? csum / wsum : null;
  }

  function renderHeader(){
    document.getElementById('stat-updated').textContent = 'Updated ' + fmtUpdated(DATA.generatedAt);
    document.getElementById('stat-positions').textContent =
      DATA.meta.pricedPositions + ' of ' + DATA.meta.totalPositions + ' positions priced';
  }

  function renderKPIs(){
    const el = document.getElementById('kpi-strip');
    el.innerHTML = DATA.funds.map(f => {
      const chg = weightedChange(f);
      const cls = chg === null ? '' : (chg >= 0 ? 'pos' : 'neg');
      const arrow = chg === null ? '' : (chg >= 0 ? '&#9650;' : '&#9660;');
      const chgTxt = chg === null ? 'n/a' : fmtPct(Math.abs(chg), false);
      const priced = f.holdings.filter(h => h.changePercent !== null).length;
      return `<button class="kpi${f.key===activeFund?' active':''}" data-fund="${f.key}" style="--fund-c:${FUND_COLOR[f.key]}">
        <span class="tag">${FUND_SHORT[f.key]}</span>
        <span class="chg ${cls}">${arrow?('<span class="arrow">'+arrow+'</span> '):''}${chgTxt}</span>
        <span class="meta">${f.holdings.length} holdings &middot; ${priced} priced today</span>
      </button>`;
    }).join('');
    el.querySelectorAll('.kpi').forEach(btn => btn.addEventListener('click', () => setActiveFund(btn.dataset.fund)));
  }

  function renderMovers(){
    const all = [];
    for(const f of DATA.funds){
      for(const h of f.holdings){
        if (h.changePercent !== null && h.changePercent !== undefined){
          all.push({ ...h, fundKey: f.key });
        }
      }
    }
    const gainers = [...all].sort((a,b)=>b.changePercent - a.changePercent).slice(0,5);
    const losers = [...all].sort((a,b)=>a.changePercent - b.changePercent).slice(0,5);
    function col(title, rows){
      return `<div class="movers-col"><div class="cap">${title}</div>` + rows.map(r => `
        <div class="mover-row">
          <div class="who"><span class="n">${escapeHtml(r.name)}</span><span class="t">${escapeHtml(r.displaySymbol)} &middot; ${FUND_SHORT[r.fundKey]}</span></div>
          <div class="chg ${r.changePercent>=0?'pos':'neg'}">${fmtPct(r.changePercent, true)}</div>
        </div>`).join('') + `</div>`;
    }
    document.getElementById('movers').innerHTML = (gainers.length||losers.length)
      ? col('Gainers', gainers) + col('Decliners', losers)
      : '<div class="movers-col"><div class="cap">No priced moves yet</div></div>';
  }

  function renderTabs(){
    const el = document.getElementById('tabs');
    el.innerHTML = DATA.funds.map(f => `<button class="tab${f.key===activeFund?' active':''}" data-fund="${f.key}" style="--fund-c:${FUND_COLOR[f.key]}">${f.short}<span class="n">${f.holdings.length}</span></button>`).join('');
    el.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => setActiveFund(btn.dataset.fund)));
  }

  function renderTable(){
    const fund = DATA.funds.find(f => f.key === activeFund);
    document.getElementById('fund-heading').textContent = fund.name;
    document.getElementById('fund-hint').textContent =
      fund.holdings.length + ' holdings' + (fund.cashFxWeight > 0.001 ? ' &middot; ' + (fund.cashFxWeight*100).toFixed(1) + '% cash / FX' : '');
    const maxW = Math.max(...fund.holdings.map(h => h.weight));
    document.getElementById('holdings-body').innerHTML = fund.holdings.map(h => {
      const priced = h.price !== null && h.price !== undefined;
      const priceTxt = priced ? fmtMoney(h.price, h.currency) : '<span class="dash">&mdash;</span>';
      const chgTxt = priced && h.change !== null ? (h.change>=0?'+':'') + h.change.toFixed(2) : '<span class="dash">&mdash;</span>';
      let pctPill = '<span class="chg-pill flat">&mdash;</span>';
      if (priced && h.changePercent !== null && h.changePercent !== undefined){
        const cls = h.changePercent > 0.005 ? 'pos' : (h.changePercent < -0.005 ? 'neg' : 'flat');
        const arrow = cls === 'pos' ? '&#9650;' : (cls === 'neg' ? '&#9660;' : '');
        pctPill = `<span class="chg-pill ${cls}">${arrow} ${fmtPct(Math.abs(h.changePercent), false)}</span>`;
      }
      const asOf = priced && h.asOfDate ? ` title="As of ${fmtDate(h.asOfDate)}"` : '';
      return `<tr>
        <td><div class="name-cell"><span class="n">${escapeHtml(h.name)}</span><span class="t">${escapeHtml(h.displaySymbol)}</span></div></td>
        <td class="num"><div class="weight-cell"><div class="weight-bar" style="--fund-c:${FUND_COLOR[fund.key]}"><i style="width:${(h.weight/maxW*100).toFixed(0)}%; background:${FUND_COLOR[fund.key]}"></i></div>${(h.weight*100).toFixed(2)}%</div></td>
        <td class="num price-cell"${asOf}>${priceTxt}</td>
        <td class="num price-cell">${chgTxt}</td>
        <td class="num">${pctPill}</td>
      </tr>`;
    }).join('');
    const fx = document.getElementById('fx-note');
    if (fund.cashFxWeight > 0.001){
      fx.hidden = false;
      fx.textContent = `Plus ${(fund.cashFxWeight*100).toFixed(2)}% held in cash and non-equity currency balances (not shown as line items).`;
    } else { fx.hidden = true; }
  }

  function setActiveFund(key){
    activeFund = key;
    renderKPIs(); renderTabs(); renderTable();
  }

  function renderNews(){
    const rank = {};
    DATA.funds.forEach(f => f.holdings.forEach(h => { rank[h.ticker] = Math.max(rank[h.ticker]||0, h.weight); }));
    const items = [...DATA.news].sort((a,b) => (rank[b.ticker]||0) - (rank[a.ticker]||0) || (b.date||'').localeCompare(a.date||''));
    document.getElementById('news-grid').innerHTML = items.map(n => `
      <article class="news-card">
        <div class="top">
          ${n.ticker && n.ticker !== 'MARKET' ? `<span class="ticker-tag">${escapeHtml(n.ticker)}</span>` : `<span class="ticker-tag">MARKET</span>`}
          <span class="date">${fmtDate(n.date)}</span>
        </div>
        <h3>${escapeHtml(n.headline)}</h3>
        <p>${escapeHtml(n.summary)}</p>
        <div class="src"><a href="${n.url}" target="_blank" rel="noopener">${escapeHtml(n.company)} &rarr;</a></div>
      </article>`).join('');
  }

  function renderFooter(){
    document.getElementById('footer').innerHTML =
      `<b>How this stays current:</b> prices and news are gathered by Claude on a recurring schedule (not a real-time market data feed) and this page is republished automatically after each pass, so what you see is the most recent completed refresh rather than a live tick-by-tick stream. Positions without a resolvable quote show &mdash;. Figures are for monitoring only, not execution.`;
  }

  renderHeader(); renderKPIs(); renderMovers(); renderTabs(); renderTable(); renderNews(); renderFooter();
})();
</script>
